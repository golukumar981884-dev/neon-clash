name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Android SDK and Java for Godot
        shell: bash
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          JAVA_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_PATH" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/java_sdk_path = "$JAVA_PATH"
          EOF
          yes | "$SDK_PATH/cmdline-tools/cmdline-tools/bin/sdkmanager" --sdk_root="$SDK_PATH" --licenses || true
          "$SDK_PATH/cmdline-tools/cmdline-tools/bin/sdkmanager" --sdk_root="$SDK_PATH" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install curl and matching Godot Android export templates
        shell: bash
        run: |
          if ! command -v curl >/dev/null 2>&1; then
            apt-get update
            apt-get install -y curl
          fi
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/godot-templates/templates.tpz
          unzip -q /tmp/godot-templates/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android" build
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import Godot project
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/TagFighter3D.apk
          test -s build/TagFighter3D.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TagFighter3D-Android-APK
          path: build/TagFighter3D.apk
          if-no-files-found: error
          retention-days: 14

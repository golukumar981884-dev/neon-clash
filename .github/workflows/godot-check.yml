name: Godot Project Check
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Run project startup check
        run: godot --headless --path . --quit
